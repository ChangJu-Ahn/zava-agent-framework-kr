[project]
name = "zava-clothing-concept-analyzer"
description = "Zava Clothing Company concept pitch deck analysis workflow"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    # Microsoft Agent Framework - GA release from PyPI.
    # agent-framework-core provides the `agent_framework` package (workflows,
    # agents, executors). We intentionally depend on it directly instead of the
    # `agent-framework` meta-package, which pulls in agent-framework-core[all]
    # (every optional connector) and is far heavier than this demo needs.
    "agent-framework-core==1.8.1",
    # Azure AI Foundry integration (replaces the pre-GA agent-framework-azure-ai
    # package); provides agent_framework.foundry.FoundryChatClient.
    "agent-framework-foundry==1.8.1",
    # PowerPoint processing
    "python-pptx>=0.6.23",
    # Environment and configuration
    "python-dotenv>=1.0.0",
    # Azure authentication
    "azure-identity>=1.15.0",
    # Telemetry and observability
    "opentelemetry-sdk>=1.37.0",
    # FastAPI web framework for UI
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
]

[tool.uv]
package = false
# agent-framework-foundry pins azure-ai-inference to a pre-release (1.0.0bN),
# so pre-releases must be permitted for the lock to resolve.
prerelease = "allow"

# Code formatting and linting configuration
[tool.ruff]
line-length = 120
target-version = "py310"
fix = true
include = ["*.py"]
exclude = ["docs/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
docstring-code-format = true

# Type checking configuration
[tool.pyright]
include = ["core", "services", "*.py"]
exclude = ["**/.venv/**"]
typeCheckingMode = "basic"
